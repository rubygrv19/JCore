allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
minimumReleaseAgeExclude:
  - '@nuxt/devtools-kit@3.4.3'
  - '@nuxt/devtools-wizard@3.4.3'
  - '@nuxt/devtools@3.4.3'
overrides:
  # DevTools 3.4.3 removes the vulnerable simple-git dependency used by 3.4.2.
  '@nuxt/devtools@^3.4.2': 3.4.3
  vue: 3.5.43
